name: Deploy production prebuilt

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-production-prebuilt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_O28gFmW5ZNtbvhzjeWkwcpAf
      VERCEL_PROJECT_ID: prj_R9yWW0awDnobLOanfer5BnTLMhRE
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm install --global vercel
      - name: Verify Vercel token is configured
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is missing"
            exit 1
          fi
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build with production environment
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt artifact to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
