name: Plugin OAuth verify

on:
  push:
    branches:
      - plugin-oauth-v1
      - main
      - fix/portable-etsy-api-key
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
